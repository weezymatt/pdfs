<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weezymatt/pdfs — a browsable library of technical PDFs</title>
<meta name="description" content="Search and browse the weezymatt/pdfs collection: thousands of technical papers, manuals, and slide decks on systems programming, CPUs, GPUs, databases, and more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="masthead">
    <h1 class="brand"><a href="#" id="brand-link">weezymatt/<b>pdfs</b></a></h1>
    <p class="stats" id="stats" aria-live="polite">loading…</p>
    <div class="masthead-actions">
      <a class="icon-btn" href="https://github.com/weezymatt/pdfs" title="Repository on GitHub" aria-label="Repository on GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme (t)" aria-label="Toggle color theme">◐</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="searchbox">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M11.7 10.3a6 6 0 1 0-1.4 1.4l3 3a1 1 0 0 0 1.4-1.4l-3-3zM7 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
      <input id="search" type="search" placeholder="Search titles, ids, topics…  ( / )" autocomplete="off" spellcheck="false" aria-label="Search the collection">
      <kbd id="search-hint">/</kbd>
    </div>
    <select id="type-filter" aria-label="Filter by document type"><option value="">all types</option></select>
    <select id="sort" aria-label="Sort order">
      <option value="new">newest first</option>
      <option value="old">oldest first</option>
      <option value="title">title A–Z</option>
      <option value="size">largest first</option>
    </select>
    <div class="view-toggle" role="group" aria-label="View">
      <button id="view-cards" title="Card view" aria-label="Card view">▦</button>
      <button id="view-list" title="List view" aria-label="List view">☰</button>
    </div>
    <button id="random" class="random-btn" title="Open a random document (r)">⚄ random</button>
  </div>

  <div class="chips" id="chips" aria-label="Filter by topic"></div>

  <figure class="histo-block">
    <div class="histo-head">
      <figcaption id="histo-caption">Documents per year — drag to filter</figcaption>
      <span id="year-readout"></span>
    </div>
    <div id="histogram" aria-label="Histogram of documents per year; drag to select a year range"></div>
  </figure>
</header>

<main>
  <p class="result-line" id="result-line" role="status"></p>
  <section id="results" class="cards"></section>
  <p class="empty" id="empty" hidden>Nothing matches — <button class="linklike" id="clear-all">clear all filters</button></p>
</main>

<footer class="site-footer">
  <p id="footer-meta"></p>
  <p>All content copyright the respective authors. Spotted something that shouldn't be here?
     <a href="https://github.com/weezymatt/pdfs#readme">See the README</a>.
     Keyboard: <kbd>/</kbd> search · <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>Enter</kbd> open · <kbd>o</kbd> download · <kbd>r</kbd> random · <kbd>t</kbd> theme</p>
</footer>

<div id="tooltip" role="tooltip" hidden></div>
<noscript><p style="padding:2rem;text-align:center">This index needs JavaScript. The raw file list lives at <a href="https://github.com/weezymatt/pdfs">github.com/weezymatt/pdfs</a>.</p></noscript>
<script src="app.js"></script>
</body>
</html>
